[project]
name = "arthashreni"
version = "0.1.0"
description = "Personal investment intelligence platform (decision support only; never trades)"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11,<4",
    "argon2-cffi>=25.1.0",
    "casparser>=1.4.1",
    "exchange-calendars>=4.13",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.8",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyrage>=1.4.0",
    "sqlalchemy>=2.1.8",
    "typer>=0.29.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
arthashreni = "arthashreni.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arthashreni"]

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "httpx>=0.28.1",
    "hypothesis>=6.170.15",
    "import-linter>=2.16",
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "pip-audit>=2.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "pyxirr>=0.10.8",
    "ruff>=0.17.4",
    "types-openpyxl>=3.1.5.20261017",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S603", "S607"]  # asserts in tests; subprocess calls use fixed argv lists

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "E501"]
"migrations/**" = ["SIM905", "E501", "S608"]  # SQL assembled from fixed constants
"src/arthashreni/dq/store.py" = ["E501"]
"src/arthashreni/db/as_of.py" = ["E501"]  # long SQL strings

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyrage", "pyrage.*", "casparser", "casparser.*", "exchange_calendars", "exchange_calendars.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket"
markers = ["property: hypothesis property tests (re-run with 1000 examples by make verify)"]

[tool.coverage.run]
source = ["arthashreni"]
branch = true

[tool.importlinter]
root_package = "arthashreni"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core imports nothing else from arthashreni and no web framework"
type = "forbidden"
source_modules = ["arthashreni.core"]
forbidden_modules = ["arthashreni.db", "arthashreni.api", "arthashreni.cli", "arthashreni.backup",
                     "fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "db does not import api, cli or web frameworks"
type = "forbidden"
source_modules = ["arthashreni.db"]
forbidden_modules = ["arthashreni.api", "arthashreni.cli", "arthashreni.ingestion", "fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "ledger is pure: no ingestion, api, cli or web frameworks (add ai/research when they exist)"
type = "forbidden"
source_modules = ["arthashreni.ledger"]
forbidden_modules = ["arthashreni.ingestion", "arthashreni.api", "arthashreni.cli", "fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "ingestion does not reach api, cli or web frameworks (add policy/risk/ai when they exist)"
type = "forbidden"
source_modules = ["arthashreni.ingestion"]
forbidden_modules = ["arthashreni.api", "arthashreni.cli", "fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "dq is pure: no db, ingestion adapters, api, cli or web frameworks (add ai/research when they exist)"
type = "forbidden"
source_modules = ["arthashreni.dq"]
forbidden_modules = ["arthashreni.db", "arthashreni.ingestion", "arthashreni.api", "arthashreni.cli",
                     "fastapi", "starlette"]

[[tool.importlinter.contracts]]
name = "analytics is pure: no db, ingestion, api, cli, sqlalchemy or web frameworks (add ai/research when they exist)"
type = "forbidden"
source_modules = ["arthashreni.analytics"]
forbidden_modules = ["arthashreni.db", "arthashreni.ingestion", "arthashreni.api", "arthashreni.cli",
                     "arthashreni.portfolio", "sqlalchemy", "fastapi", "starlette", "flask"]

[tool.mutmut]
source_paths = ["src/arthashreni/"]
do_not_mutate = [
    "src/arthashreni/api/*", "src/arthashreni/core/*", "src/arthashreni/db/*", "src/arthashreni/dq/*",
    "src/arthashreni/ingestion/*", "src/arthashreni/cli.py", "src/arthashreni/backup.py",
    "src/arthashreni/demo.py", "src/arthashreni/demo_market.py", "src/arthashreni/jobs.py",
    "src/arthashreni/portfolio.py", "src/arthashreni/__init__.py",
    "src/arthashreni/ledger/assets.py", "src/arthashreni/ledger/reconciliation.py",
    "src/arthashreni/ledger/repository.py", "src/arthashreni/ledger/models.py",
]
also_copy = ["tests/", "demo/", "config/", "alembic.ini", "migrations/", "docs/", "scripts/"]
pytest_add_cli_args = ["-p", "no:cacheprovider", "--no-cov", "--allow-hosts=127.0.0.1,::1"]
pytest_add_cli_args_test_selection = [
    "tests/test_analytics.py", "tests/test_analytics_exact.py", "tests/test_analytics_properties.py",
    "tests/test_xirr.py", "tests/test_lots.py", "tests/test_ledger_exact.py", "tests/test_ledger_properties.py",
]
