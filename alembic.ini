[alembic]
script_location = %(here)s/migrations
# URL comes from ARTHA_DB_OWNER_URL (migrations run as the owner role, ADR-0005)

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
